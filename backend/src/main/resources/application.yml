spring:
  application:
    name: nexus-crm-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexuscrm_dev}
    username: ${POSTGRES_USER:nexuscrm}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
